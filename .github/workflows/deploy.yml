name: JFDEV | Deploy production
on:
  workflow_run:
    workflows: ['JFDEV | Build Nitro']
    branches: [main]
    types: [completed]
permissions:
  actions: read
  contents: read
concurrency:
  group: jfdev-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.JFDEV_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download tested Nitro build
        uses: actions/download-artifact@v4
        with:
          name: jfdev-nitro-${{ github.event.workflow_run.head_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify and package transfer
        working-directory: release
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          sha256sum --check --strict jfdev-nitro.tar.gz.sha256
          zip -q -0 ../jfdev-release.zip jfdev-nitro.tar.gz jfdev-nitro.tar.gz.sha256
      - name: Deploy current main over restricted SSH
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_DEPLOY_HOST: ${{ secrets.JFDEV_VPS_HOST }}
          VPS_DEPLOY_PORT: ${{ secrets.JFDEV_VPS_PORT }}
          VPS_DEPLOY_KEY: ${{ secrets.JFDEV_VPS_SSH_KEY }}
          VPS_DEPLOY_KNOWN_HOSTS: ${{ secrets.JFDEV_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head_sha" != "$RELEASE_SHA" ]]; then
            echo 'Skipping a superseded main build.'
            exit 0
          fi
          : "${VPS_DEPLOY_HOST:?Missing JFDEV_VPS_HOST}" "${VPS_DEPLOY_PORT:?Missing JFDEV_VPS_PORT}"
          : "${VPS_DEPLOY_KEY:?Missing JFDEV_VPS_SSH_KEY}" "${VPS_DEPLOY_KNOWN_HOSTS:?Missing JFDEV_VPS_KNOWN_HOSTS}"
          [[ "$VPS_DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$VPS_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          umask 077
          credentials=$(mktemp -d)
          trap 'rm -rf -- "$credentials"' EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$credentials/key"
          printf '%s\n' "$VPS_DEPLOY_KNOWN_HOSTS" > "$credentials/known_hosts"
          digest=$(sha256sum jfdev-release.zip | cut -d' ' -f1)
          ssh -F /dev/null -T -p "$VPS_DEPLOY_PORT" -i "$credentials/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$credentials/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "jfdev-ci@$VPS_DEPLOY_HOST" "deploy $RELEASE_SHA $digest" < jfdev-release.zip
          printf 'Release verified by VPS: %s\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
